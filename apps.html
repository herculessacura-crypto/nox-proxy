<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apps - Nox</title>
  <style>
    :root {
      --bg: #0f0b1a;
      --bg-card: #1a1329;
      --primary: #a855f7;
      --text: #f3e8ff;
      --text-muted: #a78bfa;
      --border: #3b2a5a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 220px;
      background: #160f24;
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      position: fixed;
      height: 100vh;
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 30px;
      color: #c084fc;
    }
    .nav-item {
      display: block;
      padding: 12px 14px;
      border-radius: 10px;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 6px;
    }
    .nav-item.active, .nav-item:hover {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
    }
    .main {
      flex: 1;
      margin-left: 220px;
      padding: 40px 30px;
    }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: var(--text-muted); margin-bottom: 30px; }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }
    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: 0.2s;
    }
    .game-card:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
    }
    .game-thumb {
      height: 90px;
      background: linear-gradient(135deg, #2e1a47, #1a0f2e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    .game-info {
      padding: 12px;
      text-align: center;
    }
    .game-info h4 {
      font-size: 14px;
    }
    @media (max-width: 700px) {
      .sidebar { width: 60px; padding: 16px 8px; }
      .logo, .nav-item span:not(:first-child) { display: none; }
      .main { margin-left: 60px; padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">⚡ Nox</div>
      <a href="/" class="nav-item">🏠 Inicio</a>
      <a href="/games.html" class="nav-item">🎮 Juegos</a>
      <a href="/apps.html" class="nav-item active">📱 Apps</a>
      <a href="/settings.html" class="nav-item">⚙️ Ajustes</a>
    </aside>

    <main class="main">
      <h1>Apps</h1>
      <p class="subtitle">Acceso rápido a sitios populares</p>

      <div class="games-grid" id="apps-grid"></div>
    </main>
  </div>

  <script>
    const apps = [
      { name: "YouTube", icon: "▶️", url: "https://youtube.com" },
      { name: "Discord", icon: "💬", url: "https://discord.com/app" },
      { name: "Reddit", icon: "🤖", url: "https://reddit.com" },
      { name: "Spotify", icon: "🎵", url: "https://open.spotify.com" },
      { name: "Twitter / X", icon: "🐦", url: "https://x.com" },
      { name: "TikTok", icon: "📱", url: "https://tiktok.com" },
      { name: "Twitch", icon: "📺", url: "https://twitch.tv" },
      { name: "Netflix", icon: "🎬", url: "https://netflix.com" },
      { name: "Google", icon: "🔍", url: "https://google.com" },
      { name: "Gmail", icon: "📧", url: "https://mail.google.com" },
      { name: "ChatGPT", icon: "🤖", url: "https://chatgpt.com" },
      { name: "GitHub", icon: "💻", url: "https://github.com" }
    ];

    const grid = document.getElementById('apps-grid');
    apps.forEach(a => {
      const card = document.createElement('a');
      card.className = 'game-card';
      card.href = a.url;
      card.target = '_blank';
      card.innerHTML = `
        <div class="game-thumb">${a.icon}</div>
        <div class="game-info">
          <h4>${a.name}</h4>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
