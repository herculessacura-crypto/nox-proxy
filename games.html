<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juegos - Nox</title>
  <style>
    :root {
      --bg: #0f0b1a;
      --bg-card: #1a1329;
      --primary: #a855f7;
      --text: #f3e8ff;
      --text-muted: #a78bfa;
      --border: #3b2a5a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 220px;
      background: #160f24;
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      position: fixed;
      height: 100vh;
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 30px;
      color: #c084fc;
    }
    .nav-item {
      display: block;
      padding: 12px 14px;
      border-radius: 10px;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 6px;
    }
    .nav-item.active, .nav-item:hover {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
    }
    .main {
      flex: 1;
      margin-left: 220px;
      padding: 40px 30px;
    }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: var(--text-muted); margin-bottom: 30px; }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }
    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: 0.2s;
    }
    .game-card:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
    }
    .game-thumb {
      height: 90px;
      background: linear-gradient(135deg, #2e1a47, #1a0f2e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    .game-info {
      padding: 12px;
    }
    .game-info h4 {
      font-size: 14px;
      margin-bottom: 4px;
    }
    .game-info p {
      font-size: 12px;
      color: var(--text-muted);
    }
    @media (max-width: 700px) {
      .sidebar { width: 60px; padding: 16px 8px; }
      .logo, .nav-item span:not(:first-child) { display: none; }
      .main { margin-left: 60px; padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">⚡ Nox</div>
      <a href="/" class="nav-item">🏠 Inicio</a>
      <a href="/games.html" class="nav-item active">🎮 Juegos</a>
      <a href="/apps.html" class="nav-item">📱 Apps</a>
      <a href="/settings.html" class="nav-item">⚙️ Ajustes</a>
    </aside>

    <main class="main">
      <h1>Juegos HTML</h1>
      <p class="subtitle">Colección de juegos listos para jugar</p>

      <div class="games-grid" id="games-grid"></div>
    </main>
  </div>

  <script>
    const games = [
      { name: "Slope", icon: "🏔️", url: "https://slope.io", desc: "Corre sin parar" },
      { name: "1v1.LOL", icon: "🔫", url: "https://1v1.lol", desc: "Battle royale" },
      { name: "Cookie Clicker", icon: "🍪", url: "https://orteil.dashnet.org/cookieclicker/", desc: "Clicker clásico" },
      { name: "2048", icon: "🔢", url: "https://play2048.co", desc: "Puzzle numérico" },
      { name: "Tetris", icon: "🧱", url: "https://tetris.com/play-tetris", desc: "El clásico" },
      { name: "Snake", icon: "🐍", url: "https://playsnake.org", desc: "Serpiente" },
      { name: "Flappy Bird", icon: "🐦", url: "https://flappybird.io", desc: "Vuela alto" },
      { name: "Geometry Dash", icon: "🔷", url: "https://geometrydash.io", desc: "Ritmo y saltos" },
      { name: "Krunker", icon: "💥", url: "https://krunker.io", desc: "FPS rápido" },
      { name: "Shell Shockers", icon: "🥚", url: "https://shellshock.io", desc: "Huevos con armas" },
      { name: "Smash Karts", icon: "🏎️", url: "https://smashkarts.io", desc: "Karts locos" },
      { name: "Retro Bowl", icon: "🏈", url: "https://retrobowl.me", desc: "Fútbol americano" },
      { name: "Agar.io", icon: "🟢", url: "https://agar.io", desc: "Come y crece" },
      { name: "Run 3", icon: "🚀", url: "https://run3.io", desc: "Corre en el espacio" },
      { name: "Chess", icon: "♟️", url: "https://chess.com", desc: "Ajedrez" },
      { name: "Wordle", icon: "📝", url: "https://www.nytimes.com/games/wordle/index.html", desc: "Adivina la palabra" },
      { name: "Minecraft Classic", icon: "⛏️", url: "https://classic.minecraft.net", desc: "Minecraft clásico" },
      { name: "Basketball Stars", icon: "🏀", url: "https://basketball-stars.io", desc: "Baloncesto" },
      { name: "Subway Surfers", icon: "🏃", url: "https://subwaysurfers.com", desc: "Corre por las vías" },
      { name: "Temple Run", icon: "🏛️", url: "https://templerun2.com", desc: "Aventura" }
    ];

    const grid = document.getElementById('games-grid');
    games.forEach(g => {
      const card = document.createElement('a');
      card.className = 'game-card';
      card.href = g.url;
      card.target = '_blank';
      card.innerHTML = `
        <div class="game-thumb">${g.icon}</div>
        <div class="game-info">
          <h4>${g.name}</h4>
          <p>${g.desc}</p>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
