<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajustes - Nox</title>
  <style>
    :root {
      --bg: #0f0b1a;
      --bg-card: #1a1329;
      --primary: #a855f7;
      --primary-hover: #c084fc;
      --text: #f3e8ff;
      --text-muted: #a78bfa;
      --border: #3b2a5a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 220px;
      background: #160f24;
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      position: fixed;
      height: 100vh;
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 30px;
      color: #c084fc;
    }
    .nav-item {
      display: block;
      padding: 12px 14px;
      border-radius: 10px;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 6px;
    }
    .nav-item.active, .nav-item:hover {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
    }
    .main {
      flex: 1;
      margin-left: 220px;
      padding: 40px 30px;
    }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: var(--text-muted); margin-bottom: 30px; }
    .settings-group {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
    }
    .settings-group h3 {
      margin-bottom: 16px;
      font-size: 17px;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .setting-row:last-child { border-bottom: none; }
    .btn {
      padding: 9px 18px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      width: 160px;
    }
    @media (max-width: 700px) {
      .sidebar { width: 60px; padding: 16px 8px; }
      .logo, .nav-item span:not(:first-child) { display: none; }
      .main { margin-left: 60px; padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">⚡ Nox</div>
      <a href="/" class="nav-item">🏠 Inicio</a>
      <a href="/games.html" class="nav-item">🎮 Juegos</a>
      <a href="/apps.html" class="nav-item">📱 Apps</a>
      <a href="/settings.html" class="nav-item active">⚙️ Ajustes</a>
    </aside>

    <main class="main">
      <h1>Ajustes</h1>
      <p class="subtitle">Personaliza Nox a tu gusto</p>

      <div class="settings-group">
        <h3>Pestaña</h3>
        <div class="setting-row">
          <label>Abrir en about:blank</label>
          <button class="btn" onclick="openAboutBlank()">Abrir</button>
        </div>
        <div class="setting-row">
          <label>Título de la pestaña</label>
          <input type="text" id="tab-title" value="Nox" />
        </div>
        <div class="setting-row">
          <label>Aplicar título</label>
          <button class="btn btn-outline" onclick="document.title = document.getElementById('tab-title').value">Aplicar</button>
        </div>
      </div>

      <div class="settings-group">
        <h3>Proxy</h3>
        <div class="setting-row">
          <label>Motor de proxy</label>
          <span style="color:var(--text-muted)">Básico (en desarrollo)</span>
        </div>
      </div>

      <div class="settings-group">
        <h3>Acerca de</h3>
        <div class="setting-row">
          <label>Versión</label>
          <span>1.0.0</span>
        </div>
        <div class="setting-row">
          <label>Nombre</label>
          <span>Nox</span>
        </div>
      </div>
    </main>
  </div>

  <script>
    function openAboutBlank() {
      const win = window.open('about:blank', '_blank');
      if (win) {
        win.document.write(`
          <html>
            <head><title>Nox</title></head>
            <body style="margin:0">
              <iframe src="${location.href}" style="border:none;width:100%;height:100vh"></iframe>
            </body>
          </html>
        `);
        win.document.close();
      }
    }
  </script>
</body>
</html>
